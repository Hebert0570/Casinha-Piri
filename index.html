<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viagem Pirenópolis - Escolha da Casa</title>
  <link rel="stylesheet" href="gol.css">
</head>
<body>

  <header>
    <h1>🏡 Pirenópolis 2026 - Escolha da Casa</h1>
    <p>Clique nas casas para ver as fotos e vote na sua preferida!</p>
  </header>

  <div class="status" id="status" role="status" aria-live="polite" hidden></div>

  <main class="grid-casas" id="gridCasas"></main>

  <div class="modal" id="modalDetalhes" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-content">
      <button class="close-modal" id="btnCloseModal" aria-label="Fechar">&times;</button>
      <h2 id="modalTitle"></h2>
      <div class="carousel" id="carousel">
        <div class="gallery" id="modalGallery" tabindex="0" aria-label="Galeria de fotos"></div>
        <button class="car-btn prev" data-dir="-1" aria-label="Foto anterior">&#8249;</button>
        <button class="car-btn next" data-dir="1" aria-label="Próxima foto">&#8250;</button>
        <span class="car-count" id="carCount" aria-live="polite"></span>
      </div>
      <div class="modal-details-container" id="modalDesc"></div>
    </div>
  </div>

  <script>
  (() => {
    'use strict';

    // ===== 1. DADOS =====
    const casas = [
      {
        id: 'casa1',
        nome: 'Sítio Canarinho - R$1860',
        resumo: 'Piscina aquecida, quartos com ar-condicionado, a cerca de 2km do centro de Pirenópolis. (Não possui roupas de cama, travesseiros)',
        categorias: {
          '📺 Entretenimento': 'TV e Wi-Fi.',
          '🛏️ Quartos': '3 Quartos | 8 Camas',
          '🚻 Banheiros': '3 Banheiros',
          '❄️ Climatização': 'Ar-condicionado nos quartos, ventiladores portáteis e lareira a lenha.',
          '🍳 Cozinha': 'Refrigerador, micro-ondas, fogão elétrico, forno tradicional, liquidificador e mesa de jantar.',
          '🏊 Área Externa': 'Rede de descanso, área de jantar externa, cozinha externa completa, churrasqueira e cadeiras de sol.'
        },
        fotos: [
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1362394524088370872/original/d7eb7552-04bb-4233-aaa3-bb366ccc9cf4.jpeg?im_w=720',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1362394524088370872/original/7d32a100-1a5e-4170-a8f0-360798a87764.jpeg?im_w=720',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1362394524088370872/original/3e16b642-8671-4763-a1f4-52ac489e4a03.jpeg?im_w=720',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-U3RheVN1cHBseUxpc3Rpbmc6MTM2MjM5NDUyNDA4ODM3MDg3Mg==/original/29ba2e89-717f-4f5c-a92a-4fb031c58bfb.jpeg?im_w=720',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-U3RheVN1cHBseUxpc3Rpbmc6MTM2MjM5NDUyNDA4ODM3MDg3Mg==/original/c326ff4d-9b19-40cc-a5a6-5a660a863956.jpeg?im_w=1200',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-U3RheVN1cHBseUxpc3Rpbmc6MTM2MjM5NDUyNDA4ODM3MDg3Mg==/original/4b170b00-e82f-49ae-8c97-97b40439daec.jpeg?im_w=720',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1362394524088370872/original/9316a472-1779-4eb0-9bb7-60035d5d86d3.jpeg?im_w=720',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1362394524088370872/original/477ec44c-61a1-4c20-873d-728ddbbe15bc.jpeg?im_w=720',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-U3RheVN1cHBseUxpc3Rpbmc6MTM2MjM5NDUyNDA4ODM3MDg3Mg==/original/c89db4b1-8ba7-404e-b9fe-5fe591773518.jpeg?im_w=1200'
        ]
      },
      {
        id: 'casa2',
        nome: 'Morada da Colina - R$1518',
        resumo: 'Ar livre, áreas internas e externas, gramados e barracas de camping. (Possui roupas de cama, travesseiros e cobertores)',
        categorias: {
          '📺 Entretenimento': 'Wi-Fi, TV e Mesa de bilhar.',
          '🛏️ Quartos': '3 Quartos | 7 Camas',
          '🚻 Banheiros': '2 Banheiros',
          '❄️ Climatização': 'Ventilador portátil.',
          '🍳 Cozinha': 'Refrigerador, forno, assadeira, liquidificador, utensílios de churrasco.',
          '🏊 Área Externa': 'Churrasqueira, lareira, varanda e pátio.',
          'Banheiro': 'Banheira e chuveiro externo.'
        },
        fotos: [
          'https://a0.muscache.com/im/pictures/274832cd-3958-4d25-80f9-1d7d4adb65a7.jpg?im_w=720',
          'https://a0.muscache.com/im/pictures/4406ad95-fe85-4369-9d6b-a954ec98d69d.jpg?im_w=720',
          'https://a0.muscache.com/im/pictures/63771b39-4e1f-423e-ad38-c9d67238508a.jpg?im_w=720',
          'https://a0.muscache.com/im/pictures/67763ab0-28b6-41ef-99ba-0ffc4b97db3e.jpg?im_w=720',
          'https://a0.muscache.com/im/pictures/74a9628d-268e-4486-b799-d37926023f43.jpg?im_w=720',
          'https://a0.muscache.com/im/pictures/ed0d97bd-650b-447e-8e49-23be4cf4753e.jpg?im_w=720',
          'https://a0.muscache.com/im/pictures/49a42f5f-fa79-4c26-802e-43bc3819c709.jpg?im_w=720',
          'https://a0.muscache.com/im/pictures/c48ce339-aceb-4298-b0cf-f1039549c19b.jpg?im_w=1200',
          'https://a0.muscache.com/im/pictures/baaececf-e72d-447e-bff2-aca415e46cd5.jpg?im_w=720',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-614458344029846681/original/97e23b3b-be96-4e70-8cb4-16e3ce7042a3.jpeg?im_w=720'
        ]
      },
      {
        id: 'casa3',
        nome: 'Reserva Maslla / 7km de Piri - R$1624',
        resumo: 'Casa com suítes, churrasqueiras e piscina aquecida. (Disponibilizamos roupa de cama, lençóis, fronhas e travesseiros. Não disponibilizamos toalhas de banho e cobertores.)',
        categorias: {
          '📺 Entretenimento': 'Wi-Fi e TV.',
          '🛏️ Quartos': '3 Quartos | 10 Camas',
          '🚻 Banheiros': '4 Banheiros',
          '❄️ Climatização': 'Ventiladores portáteis e lareira interna.',
          '🍳 Cozinha': 'Refrigerador, fogão, micro-ondas e utensílios básicos, taças de vinho, utensílios para churrasco, mesa de jantar.',
          '🏊 Área Externa': 'Rede, área de jantar externa e churrasqueira.'
        },
        fotos: [
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1729871996173949753/original/5db0e3ed-7936-4d1e-89bc-a4f0ce0fed17.jpeg?im_w=720',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1729871996173949753/original/79d065ff-7e16-44bf-bca3-d948610d01fc.jpeg?im_w=720',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1729871996173949753/original/2d25897b-7d2f-4355-b90e-269f5e25fff8.jpeg?im_w=720',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1729871996173949753/original/1ac96d0d-f5ed-4762-b50c-95bc01db5c54.jpeg?im_w=720',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1729871996173949753/original/24ab5c09-2acd-43f2-8b73-b196bf307b15.jpeg?im_w=720',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1729871996173949753/original/44a89c15-12fb-4702-82f3-3015c72fc6de.png?im_w=720',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1729871996173949753/original/be854da8-889c-4aed-960a-312ba2aee254.jpeg?im_w=720',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1729871996173949753/original/5abd42c0-2b28-48b5-8422-40070d066baa.jpeg?im_w=720',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1729871996173949753/original/dd0c7bfc-1d16-4658-b72e-644d2e4b29cf.jpeg?im_w=720',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1729871996173949753/original/c32682f4-030d-4220-b74d-2a4f985b19c3.jpeg?im_w=720'
        ]
      },
      {
        id: 'casa4',
        nome: 'Santa Bárbara - R$1631',
        resumo: 'Casa completa e de visual moderno a 2km do centro, com piscina aquecida. (Camas forradas e travesseiros)',
        categorias: {
          '📺 Entretenimento': 'Wi-Fi e TV.',
          '🛏️ Quartos': '3 Quartos | 7 Camas',
          '🚻 Banheiros': '2 Banheiros',
          '❄️ Climatização': 'Ventiladores e umidificadores.',
          '🍳 Cozinha': 'Refrigerador, fogão, micro-ondas e utensílios básicos, taças de vinho, utensílios para churrasco, mesa de jantar.',
          '🏊 Área Externa': 'Rede, área de jantar externa, churrasqueira e mesa de bilhar.'
        },
        fotos: [
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1581531996129668470/original/9f91b089-be79-40a0-be08-2e4e5267c920.jpeg?im_w=720',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1581531996129668470/original/18129d5a-0976-48d6-a062-6e9afdf5a162.jpeg?im_w=1200',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1581531996129668470/original/62df2a82-c025-4807-8b44-783af846cfd2.jpeg?im_w=720',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1581531996129668470/original/3b5d46aa-9109-431b-9ed0-2902d8a3b498.jpeg?im_w=720',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1581531996129668470/original/6a05fec9-30d9-40c8-a46c-2aa6bd1096ea.jpeg?im_w=720'
        ]
      },
      {
        id: 'casa5',
        nome: 'Casa da Ana - R$1598',
        resumo: 'Casa espaçosa e funcional. Desfrute de uma área externa com churrasqueira, piscina com aquecimento solar. (Não possui itens básicos)',
        categorias: {
          '📺 Entretenimento': 'Wi-Fi e TV.',
          '🛏️ Quartos': '6 Quartos | 8 Camas',
          '🚻 Banheiros': '1,5 Banheiros',
          '❄️ Climatização': 'X.',
          '🍳 Cozinha': 'Sem Especificações.',
          '🏊 Área Externa': 'Churrasqueira.'
        },
        fotos: [
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1529205037496171165/original/2cd30312-f8b2-4503-bd04-d35148380d36.jpeg?im_w=1200',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1529205037496171165/original/a0b30837-d8cd-485e-9bfe-fa008beaa6d4.jpeg?im_w=720',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1529205037496171165/original/91324f31-16b9-418f-89a4-868b3ea1546f.jpeg?im_w=720',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1529205037496171165/original/d12eaa48-c723-4555-9472-2550250e0959.jpeg?im_w=720',
          'https://a0.muscache.com/im/pictures/hosting/Hosting-1529205037496171165/original/097e15b7-8038-4eda-ac82-ffcadea438ca.jpeg?im_w=720'
        ]
      }
    ];

    const casasMap = new Map(casas.map(c => [c.id, c]));

    // ===== 2. CONFIGURAÇÃO =====
    const JSONBIN_BIN_ID = '6abadc20ffd5d160533928bf';
    // COLOQUE AQUI A ACCESS KEY QUE VOCÊ CRIOU NO PASSO 1
    const JSONBIN_API_KEY = '$2a$10$OuJRzHcXJQAROj06CdjKTuZRanZprW/tkf8KzoQndw8kZaRxMnXce'; 
    const STORAGE_KEY = 'voto_efetuado';
    const REMOTO_ATIVO = JSONBIN_BIN_ID !== 'SEU_BIN_ID_AQUI';
    const BIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;
    
    // Usando X-Access-Key para requisições de frontend
    const HEADERS = { 
      'Content-Type': 'application/json', 
      'X-Access-Key': JSONBIN_API_KEY 
    };

    // ===== 3. ESTADO E DOM =====
    let votos = {};
    let meuVoto = lerVotoSalvo();
    let ocupado = false;

    const $ = id => document.getElementById(id);
    const gridCasas = $('gridCasas');
    const modal = $('modalDetalhes');
    const modalTitle = $('modalTitle');
    const modalDesc = $('modalDesc');
    const modalGallery = $('modalGallery');
    const carousel = $('carousel');
    const carCount = $('carCount');
    const btnPrev = carousel.querySelector('.prev');
    const btnNext = carousel.querySelector('.next');
    const btnClose = $('btnCloseModal');
    const statusEl = $('status');
    let ultimoFoco = null;

    // ===== 4. UTILITÁRIOS =====
    const esc = s => String(s).replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));

    function lerVotoSalvo() {
      try { return localStorage.getItem(STORAGE_KEY); } catch { return null; }
    }
    function salvarVoto(id) {
      try { id ? localStorage.setItem(STORAGE_KEY, id) : localStorage.removeItem(STORAGE_KEY); }
      catch { /* segue sem persistir localmente */ }
    }

    function avisar(msg, tipo = 'aviso') {
      statusEl.textContent = msg;
      statusEl.className = `status ${tipo === 'erro' ? 'erro' : ''}`;
      statusEl.hidden = !msg;
    }

    const limparVotos = obj => {
      const limpo = {};
      for (const c of casas) limpo[c.id] = Math.max(0, Number(obj?.[c.id]) || 0);
      return limpo;
    };

    // ===== 5. RENDER =====
    function renderizarCards() {
      gridCasas.innerHTML = casas.map(casa => {
        const jaVotou = meuVoto === casa.id;
        const nome = esc(casa.nome);
        return `
          <article class="card">
            <img src="${esc(casa.fotos[0])}" class="card-img" alt="Foto de ${nome}" width="320" height="200"
                 loading="lazy" decoding="async" data-action="detalhes" data-id="${casa.id}">
            <div class="card-content">
              <div>
                <h3 class="card-title">${nome}</h3>
                <p class="card-desc">${esc(casa.resumo)}</p>
              </div>
              <div>
                <button class="btn-detalhes" data-action="detalhes" data-id="${casa.id}">Ver fotos e detalhes</button>
                <div class="vote-section">
                  <button class="btn-votar ${jaVotou ? 'votado' : ''}" data-action="votar" data-id="${casa.id}"
                          ${ocupado ? 'disabled' : ''}>${jaVotou ? 'Remover voto' : 'Votar'}</button>
                  <span class="votos-count">${votos[casa.id] || 0} voto(s)</span>
                </div>
              </div>
            </div>
          </article>`;
      }).join('');
    }

    const PLACEHOLDER = 'data:image/svg+xml,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200"><rect width="100%" height="100%" fill="#dde3ea"/>' +
      '<text x="50%" y="50%" fill="#777" font-family="sans-serif" font-size="14" text-anchor="middle">Foto indisponível</text></svg>'
    );
    document.addEventListener('error', e => {
      const img = e.target;
      if (img.tagName === 'IMG' && img.src !== PLACEHOLDER) img.src = PLACEHOLDER;
    }, true);

    // ===== 6. MODAL =====
    function abrirModal(id) {
      const casa = casasMap.get(id);
      if (!casa) return;

      ultimoFoco = document.activeElement;
      modalTitle.textContent = casa.nome;
      modalGallery.innerHTML = casa.fotos.map((f, i) =>
        `<img src="${esc(f)}" alt="${esc(casa.nome)} - foto ${i + 1}" draggable="false" decoding="async"${i ? ' loading="lazy"' : ''}>`
      ).join('');
      carousel.classList.toggle('unica', casa.fotos.length < 2);
      modalGallery.scrollLeft = 0;
      atualizarCarrossel();
      modalDesc.innerHTML = Object.entries(casa.categorias).map(([titulo, info]) => `
        <div class="detail-category"><h4>${esc(titulo)}</h4><p>${esc(info)}</p></div>`
      ).join('');

      modal.classList.add('active');
      modal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('no-scroll');
      btnClose.focus();
    }

    function fecharModal() {
      modal.classList.remove('active');
      modal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('no-scroll');
      modalGallery.innerHTML = '';
      ultimoFoco?.focus?.();
    }

    function indiceAtual() {
      const w = modalGallery.clientWidth || 1;
      return Math.round(modalGallery.scrollLeft / w);
    }

    function atualizarCarrossel() {
      const total = modalGallery.children.length;
      const i = Math.min(indiceAtual(), Math.max(total - 1, 0));
      carCount.textContent = `${i + 1} / ${total}`;
      btnPrev.disabled = i <= 0;
      btnNext.disabled = i >= total - 1;
    }

    function moverCarrossel(dir) {
      modalGallery.scrollBy({ left: dir * modalGallery.clientWidth, behavior: 'smooth' });
    }

    let rafId = 0;
    modalGallery.addEventListener('scroll', () => {
      cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(atualizarCarrossel);
    }, { passive: true });

    carousel.addEventListener('click', e => {
      const btn = e.target.closest('.car-btn');
      if (btn) moverCarrossel(Number(btn.dataset.dir));
    });

    btnClose.addEventListener('click', fecharModal);
    modal.addEventListener('click', e => { if (e.target === modal) fecharModal(); });
    document.addEventListener('keydown', e => {
      if (!modal.classList.contains('active')) return;
      if (e.key === 'Escape') fecharModal();
      if (e.key === 'ArrowLeft') moverCarrossel(-1);
      if (e.key === 'ArrowRight') moverCarrossel(1);
    });

    gridCasas.addEventListener('click', e => {
      const alvo = e.target.closest('[data-action]');
      if (!alvo) return;
      const { action, id } = alvo.dataset;
      if (action === 'detalhes') abrirModal(id);
      if (action === 'votar') alternarVoto(id);
    });

    // ===== 7. REDE (JSONBin) =====
    async function requisicao(url, opcoes = {}) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 10000);
      try {
        const res = await fetch(url, { ...opcoes, headers: HEADERS, signal: ctrl.signal });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } finally {
        clearTimeout(timer);
      }
    }

    const buscarRemoto = async () => {
      const data = await requisicao(`${BIN_URL}/latest`);
      const dadosGerais = data.record || data;
      return limparVotos(dadosGerais);
    };

    async function gravarMudanca(antes, depois) {
      const atual = await buscarRemoto();
      if (antes) atual[antes] = Math.max(0, (atual[antes] || 0) - 1);
      if (depois) atual[depois] = (atual[depois] || 0) + 1;
      
      await requisicao(BIN_URL, { 
        method: 'PUT', 
        body: JSON.stringify(atual) 
      });
      
      return atual;
    }

    // ===== 8. VOTAR =====
    async function alternarVoto(idCasa) {
      if (ocupado || !casasMap.has(idCasa)) return;

      const antes = meuVoto;
      const depois = antes === idCasa ? null : idCasa;

      ocupado = true;
      avisar('');

      if (antes) votos[antes] = Math.max(0, votos[antes] - 1);
      if (depois) votos[depois] += 1;
      meuVoto = depois;
      salvarVoto(depois);
      renderizarCards();

      if (REMOTO_ATIVO) {
        try {
          votos = await gravarMudanca(antes, depois);
        } catch (err) {
          console.error('Erro ao registrar voto:', err);
          if (depois) votos[depois] = Math.max(0, votos[depois] - 1);
          if (antes) votos[antes] += 1;
          meuVoto = antes;
          salvarVoto(antes);
          avisar('Não foi possível registrar seu voto. Verifique a conexão e tente novamente.', 'erro');
        }
      }

      ocupado = false;
      renderizarCards();
    }

    // ===== 9. INICIALIZAÇÃO =====
    async function iniciar() {
      votos = limparVotos({});
      if (!casasMap.has(meuVoto)) { meuVoto = null; salvarVoto(null); }
      renderizarCards();

      if (!REMOTO_ATIVO) {
        avisar('Modo de teste: os votos não estão sendo compartilhados (JSONBin não configurado).');
        return;
      }
      try {
        votos = await buscarRemoto();
      } catch (err) {
        console.error('Erro ao carregar votos:', err);
        avisar('Não foi possível carregar os votos de todos. Recarregue a página para tentar de novo.', 'erro');
      }
      renderizarCards();
    }

    iniciar();
  })();
  </script>
</body>
</html>
